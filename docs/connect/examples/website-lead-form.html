<!doctype html>
<!-- Example only: update CONNECT_API_URL, FORM_KEY, and TURNSTILE_SITE_KEY.
     Enable server-side Turnstile validation and verify your privacy/consent text before publishing.
     Serve this from your school's HTTPS website; do NOT embed Supabase service keys. -->
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Course enquiry</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:570px;margin:36px auto;padding:0 18px;color:#193550}
form{display:grid;gap:15px;background:#fff;border:1px solid #dce8f1;border-radius:16px;padding:23px}
label{display:grid;gap:6px;font-size:14px;font-weight:650}
input,textarea{padding:11px;border-radius:9px;border:1px solid #cadbe6;font:inherit}
button{background:#1664c7;color:white;padding:12px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
#status{min-height:22px}small{color:#5f7183}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<h1>Ask about our courses</h1>
<p>Send us an enquiry and our admissions team will respond.</p>
<form id="enquiry-form">
<label>Your name <input name="name" required minlength="2" maxlength="150" autocomplete="name"/></label>
<label>Email <input name="email" type="email" autocomplete="email"/></label>
<label>Phone <input name="phone" type="tel" autocomplete="tel"/></label>
<label>What would you like to learn? <textarea name="message" maxlength="2000" rows="3"></textarea></label>
<label style="display:none">Website URL <input name="website_url" tabindex="-1" autocomplete="off"/></label>
<label><span><input name="consent" type="checkbox" required/> I agree that the institute may contact me about this enquiry.</span></label>
<!-- Replace this placeholder with your PUBLIC Cloudflare Turnstile SITE KEY. -->
<div class="cf-turnstile" data-sitekey="TURNSTILE_SITE_KEY"></div>
<button type="submit">Send enquiry</button>
<p id="status" role="status" aria-live="polite"></p>
<small>This form only requests an admissions follow-up; it does not grant marketing opt-in.</small>
</form>
<script>
const CONNECT_API_URL="https://YOUR-DEV-CONNECT-HOST.example";
const FORM_KEY="PASTE_PUBLIC_FORM_IDENTIFIER";
const form=document.querySelector("#enquiry-form");
const status=document.querySelector("#status");
let eventId=null;
form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const data=new FormData(form);
 if(!String(data.get("email")||"").trim()&&!String(data.get("phone")||"").trim()){
  status.textContent="Enter your email or phone number.";return;
 }
 if(!eventId)eventId=crypto.randomUUID(); // keep same ID when a failed request is retried
 const button=form.querySelector('button[type="submit"]');
 button.disabled=true;status.textContent="Sending…";
 try{
  const payload={
   eventId,name:String(data.get("name")||"").trim(),
   email:String(data.get("email")||"").trim(),
   phone:String(data.get("phone")||"").trim(),
   message:String(data.get("message")||"").trim(),
   website_url:String(data.get("website_url")||""),
   consent:data.get("consent")==="on",
   turnstileToken:String(data.get("cf-turnstile-response")||"")
  };
  const response=await fetch(CONNECT_API_URL+"/api/connect/public/forms/"+encodeURIComponent(FORM_KEY),{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)
  });
  if(!response.ok)throw new Error("The enquiry could not be delivered.");
  status.textContent="Thank you. Your enquiry has been received.";
  form.reset();eventId=null;
 }catch(err){status.textContent=err.message+" Please retry.";}
 finally{button.disabled=false;window.turnstile?.reset();}
});
</script>
</body>
</html>
