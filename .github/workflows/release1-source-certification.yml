name: Education Suite Release 1 source certification
on:
  push:
    branches:
      - feature/education-suite-release1
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'database/**'
      - 'scripts/**'
      - 'qa/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release1-source-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Academy legacy read-only data access inventory
        run: node scripts/audit-academy-data-access.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unified suite navigation registry contracts
        run: node --experimental-strip-types --test lib/platform/suite-modules.test.mjs lib/platform/suite-shell.test.mjs
      - name: SaaS organization and Academy authorization contracts
        run: node --test lib/server/saas/*.test.mjs
      - name: Standalone Academy CRM Tasks deployment and authorization compatibility
        run: npm run check:modules && npm run check:auth && npm run check:backend-modules && npm run check:deployment-profiles
      - name: Tasks and CRM business regressions
        run: npm run test:tasks-v2 && npm run test:connect-business
      - name: Release source regression suite
        run: npm run check:release
      - name: Targeted offline academic, finance and permission contract specs
        run: npx playwright test qa/parent-billing-config.spec.ts qa/scheduling-v2-preview.spec.ts qa/phase3-validation.spec.ts --project=desktop-chromium --no-deps
      - name: Source security checks
        run: npm run check:security
      - name: Generate and validate canonical SQL installers (no database connection)
        run: npm run db:build-installers
      - name: Database package preflight
        run: node scripts/check-release1-db-preflight.mjs
      - name: Dynamic database contract preflight
        run: node scripts/check-release1-dynamic-db-targets.mjs
      - name: Publish non-sensitive check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-source-certification
          path: |
            artifacts/release1-certification/
            artifacts/release1-dynamic-contracts/
          retention-days: 14
