name: Phase 7A Real DEV Customer Activation
on:
  push:
    branches:
      - feature/education-suite-phase7a-customer-onboarding
permissions:
  contents: read
jobs:
  live:
    if: contains(github.event.head_commit.message, '[phase7a-live-dev]')
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 15
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Real authenticated DEV customer onboarding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$E2E_SUPABASE_URL" = "https://uzzuquxeeqonxeqcuohh.supabase.co" ]]
          export NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY"
          export SUPABASE_URL="$E2E_SUPABASE_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$E2E_SUPABASE_SERVICE_ROLE_KEY"
          npm run dev -- --hostname 127.0.0.1 > /tmp/phase7a-next-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/phase7a-next-dev.log; exit 1; fi
          node scripts/qa-phase7a-live.mjs
