name: Phase 6B Commercial Branding
on:
  push:
    branches:
      - feature/education-suite-phase6b-branding-controls
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-phase6b-branding.mjs
      - run: node --test scripts/test-phase6a-branding.mjs
      - run: npm run test:branding-studio
      - run: npm run test:theme-foundation
      - run: node --test scripts/test-phase5c-branding.mjs
      - run: npm run typecheck
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "synthetic-phase6b-browser-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium --with-deps
      - name: Admin and Owner branding browser acceptance
        run: npx playwright test qa/phase6b-branding.spec.ts --project=desktop-chromium --no-deps
      - name: Existing tenant theme browser regression
        run: npx playwright test qa/phase5c-white-label.spec.ts --project=desktop-chromium --no-deps
