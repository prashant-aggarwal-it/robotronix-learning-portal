name: Phase 9B Service Health
on:
  push:
    branches:
      - feature/education-suite-phase9b-service-health
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-phase9b-service-health.mjs scripts/test-phase9a-system-health.mjs scripts/test-phase8e-certification.mjs
      - run: npm run typecheck
      - run: npm run build
