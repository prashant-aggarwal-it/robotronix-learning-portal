name: One-time dependency security refresh
on:
  push:
    branches:
      - release/consolidated-stabilization-20261020
    paths:
      - security/dependency-refresh-trigger.txt
permissions:
  contents: write
jobs:
  refresh-locked-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh compatible lockfile patches only
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
      - name: Confirm no code-level regression
        run: |
          npm run check:release
          npm run build
        env:
          NEXT_PUBLIC_APP_ENV: demo
      - name: Commit vetted lockfile changes to the stabilization branch only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile remediation was available"
            exit 0
          fi
          git config user.name "robotronix-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh compatible locked security patches"
          git push origin HEAD:refs/heads/release/consolidated-stabilization-20261020
  # xlsx currently has no npm patch; replacement remains a separate reviewed fix.
