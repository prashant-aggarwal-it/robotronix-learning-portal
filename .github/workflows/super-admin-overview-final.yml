name: Super Admin Overview Final Fix
on:
  push:
    branches:
      - fix/suite-stale-organization-selection
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-super-admin-overview-final.mjs scripts/test-priority-followups.mjs scripts/test-suite-stale-org-recovery.mjs lib/server/saas/organization-switch-contract.test.mjs lib/platform/suite-shell.test.mjs
      - run: npm run typecheck
      - run: npm run build
