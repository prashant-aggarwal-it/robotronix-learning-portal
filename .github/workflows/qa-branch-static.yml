name: QA branch static validation
on:
  push:
    branches:
      - fix/qa-onboarding-save-feedback-20261025
      - feature/education-suite-phase4d
      - feature/education-suite-phase5a-theme-foundation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Shared typography contract
        run: node scripts/check-typography.mjs
      - name: Phase 5A theme architecture tests
        run: npm run test:theme-foundation
      - name: Typecheck
        run: npm run typecheck
      - name: Billing and finance regression tests
        run: npx playwright test qa/parent-billing-config.spec.ts --project=desktop-chromium --no-deps
      - name: Authentication callback regression
        run: node --test scripts/test-auth-confirmation-callback.test.mjs
      - name: Phase 4D source and contract checks
        run: |
          npm run db:check-canonical
          npm run db:check-packages
          npm run check:connect-hardening
          npm run test:connect-business
          npm run test:tasks-v2
          npm run test:phase4e
          npx playwright test qa/payroll-rules.spec.ts qa/security-static.spec.ts --project=desktop-chromium --no-deps
