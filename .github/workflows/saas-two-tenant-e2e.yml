name: DEV SaaS authenticated Academy and Phase 3A two-tenant E2E
on:
  push:
    branches:
      - feature/education-suite-release1
    paths:
      - scripts/saas-two-tenant-e2e.mjs
      - app/api/platform/organization-links/route.ts
      - database/saas/12_module_links_rpc.sql
      - database/saas/3*.sql
      - database/saas/2*.sql
      - app/api/zoom/**
      - app/api/admin/invoices/**
      - lib/server/saas/**
      - components/RoleGuard.tsx
      - .github/workflows/saas-two-tenant-e2e.yml
  workflow_dispatch:
concurrency:
  group: dev-saas-authenticated-e2e-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  authenticated-dev-two-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: qa
    env:
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install browser for authenticated Suite UI switching verification
        run: npx playwright install --with-deps chromium
      - name: Authenticated DEV Academy and linked CRM/Tasks tenant isolation test
        run: node scripts/saas-two-tenant-e2e.mjs
      - name: Phase 3C authenticated membership invitation acceptance and revocation
        run: node scripts/saas-phase3c-invitations-e2e.mjs
