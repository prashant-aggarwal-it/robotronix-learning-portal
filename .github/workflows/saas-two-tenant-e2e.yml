name: DEV SaaS authenticated Academy and Phase 3A two-tenant E2E
on:
  push:
    branches:
      - feature/education-suite-release1
      - feature/education-suite-phase3d
      - feature/education-suite-phase3e
      - feature/education-suite-phase3f
      - feature/education-suite-phase3g
      - feature/education-suite-phase4c
      - feature/education-suite-phase4d
    paths:
      - scripts/saas-two-tenant-e2e.mjs
      - scripts/saas-phase3c-invitations-e2e.mjs
      - app/api/connect/workspaces/**/admissions/route.ts
      - app/api/platform/organization-links/route.ts
      - database/saas/12_module_links_rpc.sql
      - database/saas/68_phase4c_private_table_privileges.sql
      - database/saas/71_phase4d_academy_subscription_rpc_guard.sql
      - database/saas/3*.sql
      - database/saas/45_phase3d_crm_tasks_owner_sync_guard.sql
      - database/saas/4*.sql
      - 'database/saas/5*.sql'
      - database/saas/50_phase3e_guard_legacy_portal_installs.sql
      - app/api/connect/workspaces/[tenantId]/portal-integration/route.ts
      - lib/server/connect-portal-access.ts
      - database/shared/integrations/02_tasks_crm.sql
      - database/saas/2*.sql
      - app/api/zoom/**
      - app/api/admin/invoices/**
      - lib/server/saas/**
      - app/api/platform/**
      - app/api/platform-admin/**
      - lib/platform/auth-routing.ts
      - components/RoleGuard.tsx
      - .github/workflows/saas-two-tenant-e2e.yml
  workflow_dispatch:
concurrency:
  group: dev-saas-authenticated-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  authenticated-dev-two-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: qa
    env:
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install browser for authenticated Suite UI switching verification
        run: npx playwright install --with-deps chromium
      - name: Authenticated DEV Academy and linked CRM/Tasks tenant isolation test
        run: node scripts/saas-two-tenant-e2e.mjs
      - name: Phase 3C authenticated membership invitation acceptance and revocation
        run: node scripts/saas-phase3c-invitations-e2e.mjs
