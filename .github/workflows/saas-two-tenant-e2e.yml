name: DEV SaaS Academy authenticated two-tenant E2E
on:
  push:
    branches:
      - feature/education-suite-release1
    paths:
      - scripts/saas-two-tenant-e2e.mjs
      - .github/workflows/saas-two-tenant-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-dev-two-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: qa
    env:
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Authenticated real HTTP two-tenant Academy test on verified DEV project only
        run: node scripts/saas-two-tenant-e2e.mjs
