name: Phase 7A Exact-Scope DEV Auth Cleanup
on:
  push:
    branches:
      - feature/education-suite-phase7a-customer-onboarding
permissions:
  contents: read
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[phase7a-cleanup-dev]')
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 12
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/qa-phase7a-cleanup.mjs
