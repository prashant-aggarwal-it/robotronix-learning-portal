name: Connect branch validation
on:
  push:
    branches:
      - feature/robotronix-connect-crm
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connect-branch-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build with demo environment
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: demo
      - name: Structure and communication checks
        run: npm run check:structure && npm run check:communication && node scripts/check-connect-db-layout.mjs
